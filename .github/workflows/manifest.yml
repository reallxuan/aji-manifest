name: Publish manifest

on:
  workflow_dispatch:
    inputs:
      aji_ref:
        description: Ref of reallxuan/Aji to build the manifest tool from
        required: true
        default: main

concurrency:
  group: pages
  cancel-in-progress: false

permissions: {}

jobs:
  # Builds and runs third-party code (Cargo build scripts, proc macros, network calls). It never
  # sees the signing secret.
  generate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: reallxuan/Aji
          ref: ${{ inputs.aji_ref }}
          path: aji
          persist-credentials: false

      - name: Install the Rust toolchain
        working-directory: aji
        run: rustup toolchain install

      - name: Build the manifest tool
        working-directory: aji
        run: cargo build --release --locked -p aji-manifest-tool

      - name: Generate the manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: aji/target/release/aji-manifest generate --out site/v1/manifest.json

      - name: Collect the artifact
        run: |
          mkdir bundle
          cp site/v1/manifest.json aji/target/release/aji-manifest bundle/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated
          path: bundle
          if-no-files-found: error

  # Holds the secret. It builds and runs nothing from Aji: only apt's minisign and the manifest
  # bytes.
  sign:
    needs: generate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: generated
          path: bundle

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Sign the manifest
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          umask 077
          KEY=$(mktemp)
          trap 'rm -f "$KEY"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$KEY"
          SEQUENCE=$(jq -er .sequence bundle/manifest.json)
          minisign -S -s "$KEY" -m bundle/manifest.json -x bundle/manifest.json.minisig \
            -t "aji-manifest sequence $SEQUENCE"
          rm -f "$KEY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed
          path: |
            bundle/manifest.json
            bundle/manifest.json.minisig
          if-no-files-found: error

  # Verifies the signature with the generated binary (no secret in this job), then uploads the
  # site for the deploy job.
  verify:
    needs: sign
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: generated
          path: generated

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed
          path: site/v1

      - name: Verify the signature
        run: |
          chmod +x generated/aji-manifest
          generated/aji-manifest verify \
            --manifest site/v1/manifest.json \
            --signature site/v1/manifest.json.minisig \
            --public-key keys/aji-manifest.pub

      # Reads one file, runs nothing: the keys Aji ships at the ref the manifest was built from.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: reallxuan/Aji
          ref: ${{ inputs.aji_ref }}
          path: aji
          persist-credentials: false
          sparse-checkout: crates/aji-manager/src/manifest/keys.rs
          sparse-checkout-cone-mode: false

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      # A manifest signed by a key Aji does not trust would be refused by every copy of Aji.
      - name: Verify against the keys Aji trusts
        run: |
          KEYS=$(grep -oE '"RW[A-Za-z0-9+/]{54}"' aji/crates/aji-manager/src/manifest/keys.rs | tr -d '"' || true)
          if [ -z "$KEYS" ]; then
            echo "::error::no minisign public key found in Aji's keys.rs"
            exit 1
          fi
          for KEY in $KEYS; do
            if minisign -V -P "$KEY" -m site/v1/manifest.json -x site/v1/manifest.json.minisig; then
              exit 0
            fi
          done
          echo "::error::the manifest is not signed by any key in Aji's TRUSTED_KEYS"
          exit 1

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  # Its own job, as in GitHub's Pages starter workflow: in the job that uploaded it, deploy-pages
  # listed the run's artifacts before the upload showed up and failed twice in a row.
  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
